name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy pillow

      - name: Build APK with Buildozer
        run: |
          cd $GITHUB_WORKSPACE
          # Pre-accept all android SDK licenses automatically
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Run buildozer with the CI option flag to accept licenses natively
          buildozer --log_level=2 android debug
        env:
          APP_ANDROID_ARCHS: armeabi-v7a
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: bin/*.apk
